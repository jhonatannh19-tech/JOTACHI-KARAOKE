name: Build JOTACHI Karaoke APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source zip
        run: |
          unzip -o jotachi_karaoke.zip -d _src
          if [ "$(ls -A _src | wc -l)" = "1" ] && [ -d "_src/$(ls _src)" ]; then
            cp -a _src/*/. .
          else
            cp -a _src/. .
          fi
          rm -rf _src
      - name: Patch known build errors
        run: |
          grep -q dependency_overrides pubspec.yaml || printf '\ndependency_overrides:\n  record_linux: ^1.1.0\n' >> pubspec.yaml
          sed -i 's/CardTheme(/CardThemeData(/' lib/theme/app_theme.dart
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
            - name: Raise compileSdk for plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/sdk.gradle <<'EOF'
          allprojects {
              afterEvaluate { p ->
                  def ext = p.extensions.findByName('android')
                  if (ext != null && p.plugins.hasPlugin('com.android.library')) {
                      ext.compileSdkVersion(36)
                  }
              }
          }
          EOF
